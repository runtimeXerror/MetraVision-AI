[pytest]
testpaths = tests
# `slow` marks the tests that load the pretrained weights and run inference.
# Excluded by default so the fast suite stays a couple of seconds; run them
# with `pytest -m slow`.
addopts = -m "not slow" -q
markers =
    slow: loads the OCR model and runs real inference
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
